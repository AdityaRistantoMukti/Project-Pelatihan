<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulir Pendaftaran</title>
  </head>
  <body bgcolor="lightyellow">
    <!-- Navbar -->
    <header>
      <center>
        <nav align="center">
          <a href="index.html">Beranda</a> |
          <a href="formulirPendaftaran.html">Formulir Pendaftaran</a> |
          <a href="tabelPeserta.html">Tabel Peserta</a>
        </nav>
        <hr />
      </center>
    </header>

    <!-- BIODATA PESERTA -->
    <main>
      <h1 align="center"><font color="pink">Formulir Pendaftaran</font></h1>
      <!-- Data Pribadi -->
      <fieldset>
        <legend>
          <b><font color="pink">Data Pribadi</font></b>
        </legend>

        <table bgcolor="#BDB2FF" width="100%">
          <tr>
            <td>
              <label for="nama">Nama :</label>
              <br />
              <input type="text" name="nama" id="nama" placeholder="Masukkan nama" required />
              <br />

              <label>Jenis Kelamin :</label>
              <br />
              <input type="radio" name="gender" value="Laki-Laki" />Laki-Laki <input type="radio" name="gender" value="Perempuan" />Perempuan
              <br />

              <label for="agama">Agama:</label>
              <br />
              <select name="agama" id="agama">
                <option value="Islam">Islam</option>
                <option value="Kristen">Kristen</option>
                <option value="Katolik">Katolik</option>
                <option value="Hindu">Hindu</option>
                <option value="Budha">Budha</option>
              </select>
              <br />

              <label for="tempat-lahir">Tempat Lahir:</label>
              <br />
              <input type="text" name="tempat-lahir" id="tempat-lahir" placeholder="Masukkan tempat lahir" required />
              <br />

              <label for="tanggal-lahir">Tanggal Lahir:</label>
              <br />
              <input type="date" name="tanggal-lahir" id="tanggal-lahir" required />
              <br />

              <label for="alamat">Alamat:</label>
              <br />
              <textarea name="alamat" id="alamat" placeholder="Masukkan alamat" required></textarea>
            </td>
          </tr>
        </table>
      </fieldset>

      <!--Pendidikan-->
      <fieldset>
        <legend>
          <b><font color="pink">Pendidikan</font></b>
        </legend>
        <table bgcolor="#FFD6E0" width="100%">
          <tr>
            <td>
              <label for="sd">SD:</label>
              <br />
              <input type="text" name="sd" id="sd" placeholder="Masukkan nama sekolah" required />
              <label for="tahun-masuk">Masuk</label>
              <input type="date" />
              <label for="tahun-lulus">Lulus</label>
              <input type="date" />
              <br />
              <label for="smp">SMP:</label>
              <br />
              <input type="text" name="smp" id="smp" placeholder="Masukkan nama sekolah" required />
              <label for="tahun-masuk">Masuk</label>
              <input type="date" />
              <label for="tahun-lulus">Lulus</label>
              <input type="date" />
              <br />
              <label for="sma">SMA:</label>
              <br />
              <input type="text" name="sma" id="sma" placeholder="Masukkan nama sekolah" required />
              <label for="tahun-masuk">Masuk</label>
              <input type="date" />
              <label for="tahun-lulus">Lulus</label>
              <input type="date" />
              <br />
            </td>
          </tr>
        </table>
      </fieldset>

      <!-- Pelatihan -->
      <fieldset>
        <legend>
          <b><font color="pink">Pelatihan</font></b>
        </legend>
        <table bgcolor="#BDB2FF" width="100%">
          <tr>
            <td>
              <label for="minat">Minat</label>
              <br />
              <input type="radio" name="minat" value="html" />HTML <input type="radio" name="minat" value="css" />CSS <input type="radio" name="minat" value="javascript" />Javascript <input type="radio" name="minat" id="php" />PHP
              <br /><br />
              <label for="Kompetensi">Kompetensi</label>
              <br />
              <input type="radio" name="kompetensi" value="html" />HTML <input type="radio" name="kompetensi" value="css" />CSS <input type="radio" name="kompetensi" value="javascript" />Javascript
              <input type="radio" name="kompetensi" id="php" />PHP <br /><br />
            </td>
          </tr>
        </table>
      </fieldset>

      <!--Pilih Jurusan-->
      <fieldset>
        <legend>
          <b><font color="pink">Pilih Jurusan</font></b>
        </legend>
        <table bgcolor="#FFD6E0" width="100%">
          <tr>
            <td>
              <select name="jurusan" id="jurusan" required>
                <optgroup label="Teknik">
                  <option value="informatika">Teknik Informatika</option>
                  <option value="elektro">Teknik Elektro</option>
                  <option value="industri">Teknik Industri</option>
                  <option value="sipil">Teknik Sipil</option>
                </optgroup>
                <optgroup label="Ekonomi">
                  <option value="akuntansi">Akuntansi</option>
                  <option value="manajemen">Manajemen</option>
                  <option value="perbankan">Perbankan</option>
                  <option value="bisnis">Bisnis Digital</option>
                </optgroup>
              </select>
            </td>
          </tr>
        </table>
      </fieldset>
      <br />
      <!-- Tombol -->
      <input type="submit" value="Submit" class="btn-submit" />
      <input type="reset" value="Reset" class="brn-reset" />
    </main>
  </body>
</html>
